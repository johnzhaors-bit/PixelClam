<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>最后组件批次受控错误</title><style>
*{box-sizing:border-box}body{margin:0;color:#4d4d4d;font:12px/1.5 Arial,sans-serif}main{padding:20px}.row{display:flex;gap:24px;margin:18px 0}.sample{width:500px;min-height:120px;padding:12px;border:1px solid #eee}.title{display:block;margin-bottom:8px;font-weight:700}
.tags{display:flex;padding:4px 16px;border:1px solid #d9d9d9}.tag-option{height:28px;min-width:60px;padding:4px 8px;margin-right:8px;border-radius:24px;background:#e6f5ff;color:#1993ff;text-align:center}.tags-bad .tag-option{height:36px;min-width:60px;border-radius:4px}
.query{padding:8px;border:1px solid #d9d9d9;border-radius:3px}.query-item{display:flex;padding:4px 8px}.query-label{line-height:32px}.query-bad{padding:2px;border-radius:8px}
.transfer{display:flex;align-items:flex-start}.panel{width:180px;height:100px;border:1px solid #d9d9d9;padding:8px}.moves{display:flex;flex-direction:column;gap:8px;padding:28px 8px}.transfer-bad{flex-direction:row-reverse}.transfer button:disabled{cursor:not-allowed}.transfer-bad button{cursor:pointer}
.tree-node{height:24px;line-height:24px}.tree-icon{display:inline-block;width:16px;font-size:16px}.tree-bad .tree-node{height:36px;line-height:36px}.tree-bad .tree-icon{width:12px;font-size:12px}
.drop{padding:20px;border:1px dashed #d9d9d9;text-align:center}.upload-bad .drop{border:none}.hint{color:#737373}.upload-bad .hint{display:none}
.steps{display:flex;align-items:center}.step{display:flex;align-items:center;flex:1}.marker{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#eee}.connector{height:2px;flex:1;background:#d9d9d9}.current .marker{background:#1993ff;color:#fff}.completed .marker{background:#53bd73;color:#fff}.wizard-bad .step{flex:1}
</style></head><body><main>
<section class="row"><div id="tag-filtering-bad" class="sample" data-component-family="tag-filtering" data-size="sm"><span class="title">错误标签筛选</span><div class="tags tags-bad"><span class="tag-option">全部</span><span class="tag-option">运行中</span></div></div><div id="tag-filtering-clean" class="sample" data-component-family="tag-filtering" data-size="sm"><span class="title">正确标签筛选</span><div class="tags"><span class="tag-option">全部</span><span class="tag-option">运行中</span></div></div></section>
<section class="row"><div id="template-query-bad" class="sample" data-component-family="template-query"><span class="title">错误模板查询</span><div class="query query-bad"><div class="query-item"><span class="query-label">资源类型：</span><span>数据库</span></div></div></div><div id="template-query-clean" class="sample" data-component-family="template-query"><span class="title">正确模板查询</span><div class="query"><div class="query-item"><span class="query-label">资源类型：</span><span>数据库</span></div></div></div></section>
<section class="row"><div id="transfer-bad" class="sample" data-component-family="transfer" data-selected-count="0"><span class="title">错误穿梭框</span><div class="transfer transfer-bad"><div class="panel">源列表<br>资源 A</div><div class="moves"><button>→</button><button>←</button></div><div class="panel">目标列表<br>暂无数据</div></div></div><div id="transfer-clean" class="sample" data-component-family="transfer" data-selected-count="0"><span class="title">正确穿梭框</span><div class="transfer"><div class="panel">源列表<br>资源 A</div><div class="moves"><button disabled>→</button><button disabled>←</button></div><div class="panel">目标列表<br>暂无数据</div></div></div></section>
<section class="row"><div id="tree-bad" class="sample tree-bad" data-component-family="tree"><span class="title">错误树</span><div class="tree-node"><span class="tree-icon">▾</span>资源目录</div><div class="tree-node"><span class="tree-icon"></span>　数据库</div></div><div id="tree-clean" class="sample" data-component-family="tree"><span class="title">正确树</span><div class="tree-node"><span class="tree-icon">▾</span>资源目录</div><div class="tree-node"><span class="tree-icon"></span>　数据库</div></div></section>
<section class="row"><div id="upload-bad" class="sample upload-bad" data-component-family="upload" data-accept="image/png"><span class="title">错误上传</span><div class="drop">将文件拖到此处上传</div><div class="hint">仅支持 PNG</div></div><div id="upload-clean" class="sample" data-component-family="upload" data-accept="image/png"><span class="title">正确上传</span><div class="drop">⇧ 将文件拖到此处上传</div><div class="hint">仅支持 PNG 文件</div></div></section>
<section class="row"><div id="wizard-bad" class="sample wizard-bad" data-component-family="wizard" data-current-step="2"><span class="title">错误步骤条</span><div class="steps"><div class="step current"><span class="marker">1</span><span>配置</span><i class="connector"></i></div><div class="step current"><span class="marker">2</span><span>完成</span></div></div></div><div id="wizard-clean" class="sample" data-component-family="wizard" data-current-step="2"><span class="title">正确步骤条</span><div class="steps"><div class="step completed"><span class="marker">✓</span><span>基础信息</span><i class="connector"></i></div><div class="step current"><span class="marker">2</span><span>配置</span><i class="connector"></i></div><div class="step"><span class="marker">3</span><span>完成</span></div></div></div></section>
</main></body></html>
