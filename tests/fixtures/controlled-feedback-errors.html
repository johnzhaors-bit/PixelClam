<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>反馈展示组件受控错误</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#4d4d4d;font:12px/1.5 "Helvetica Neue","PingFang SC",Tahoma,"Microsoft Yahei",sans-serif}main{margin:32px;padding:24px;background:#fff}h1{margin:0 0 24px}.row{display:flex;align-items:center;gap:40px;margin:24px 0}.sample{min-width:260px}
.tooltip-bad,.tooltip-clean{display:inline-block;min-width:60px;text-align:center;background:#fff;border:1px solid #d9d9d9}.tooltip-bad{height:40px;line-height:40px;padding:0 12px;border-radius:8px}.tooltip-clean{height:30px;line-height:30px;padding:0 12px;border-radius:3px}
.badge-host{position:relative;display:inline-block;width:64px;height:32px;border:1px solid #d9d9d9}.badge-bad,.badge-clean{position:absolute;border-radius:50%;background:#f54c4c;border:1px solid #fff}.badge-bad{width:14px;height:14px;right:-8px;top:-8px}.badge-clean{width:8px;height:8px;right:-4px;top:-4px}
.status-item{display:inline-flex;align-items:center;gap:8px}.status-bad-dot{width:16px;height:16px;border-radius:50%;background:#f54c4c}.status-clean-dot{width:10px;height:10px;border-radius:50%;background:#53bd73}
.progress-wrap{display:inline-flex;align-items:center;gap:16px}.progress-bad,.progress-clean{position:relative;overflow:hidden;border-radius:20px;background:#eee}.progress-bad{width:260px;height:10px}.progress-clean{width:200px;height:4px}.progress-fill{height:100%;width:60%;background:#1993ff}
.slider-bad,.slider-clean{display:inline-block;position:relative;width:240px;height:16px}.slider-bad .rail,.slider-clean .rail{position:absolute;left:0;right:0;top:6px;border-radius:2px;background:#eee}.slider-bad .track,.slider-clean .track{position:absolute;left:0;top:6px;width:50%;border-radius:2px;background:#1993ff}.slider-bad .rail,.slider-bad .track{height:8px}.slider-clean .rail,.slider-clean .track{height:4px}.slider-bad .thumb,.slider-clean .thumb{position:absolute;left:50%;top:8px;transform:translate(-50%,-50%);border:2px solid #1993ff;border-radius:50%;background:#fff}.slider-bad .thumb{width:20px;height:20px}.slider-clean .thumb{width:14px;height:14px}
</style></head><body><main><h1>反馈与展示组件</h1>
<section class="row"><div id="tooltip-bad" class="sample" data-component-family="tooltip"><span class="tooltip-bad">错误提示</span></div><div id="tooltip-clean" class="sample" data-component-family="tooltip"><span class="tooltip-clean">正确提示</span></div></section>
<section class="row"><div id="badge-bad" class="sample" data-component-family="badge"><span class="badge-host">消息<span class="badge-bad"></span></span></div><div id="badge-clean" class="sample" data-component-family="badge"><span class="badge-host">消息<span class="badge-clean"></span></span></div></section>
<section class="row"><div id="status-bad" class="sample" data-component-family="status" data-status="success"><span class="status-item"><span class="status-bad-dot"></span>运行正常</span></div><div id="status-clean" class="sample" data-component-family="status" data-status="success"><span class="status-item"><span class="status-clean-dot"></span>运行正常</span></div></section>
<section class="row"><div id="progress-bad" class="sample" data-component-family="progress" data-value="60"><span class="progress-wrap"><span class="progress-bad"><span class="progress-fill"></span></span><span>60%</span></span></div><div id="progress-clean" class="sample" data-component-family="progress" data-value="60"><span class="progress-wrap"><span class="progress-clean"><span class="progress-fill"></span></span><span>60%</span></span></div></section>
<section class="row"><div id="slider-bad" class="sample"><span class="slider-bad" data-component-family="slider" role="slider" aria-label="错误滑动条" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="rail"></span><span class="track"></span><span class="thumb"></span></span></div><div id="slider-clean" class="sample"><span class="slider-clean" data-component-family="slider" role="slider" aria-label="正确滑动条" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span class="rail"></span><span class="track"></span><span class="thumb"></span></span></div></section>
</main></body></html>
