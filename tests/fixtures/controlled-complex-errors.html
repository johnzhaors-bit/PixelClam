<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>复杂组件受控错误</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#4d4d4d;font:12px/1.5 "Helvetica Neue","PingFang SC",Tahoma,"Microsoft Yahei",sans-serif}main{margin:32px;padding:24px;background:#fff}h1{margin:0 0 24px}.row{display:flex;align-items:flex-start;gap:40px;margin:24px 0}.sample{position:relative;width:440px;min-height:100px;border:1px solid #eee;padding:16px}.label{display:block;margin-bottom:8px;font-weight:700}
.condition-table{width:100%;border-collapse:collapse}.condition-table th{height:26px;padding-right:8px;text-align:left;font-weight:400}.condition-table td{height:40px;padding:0 8px 0 0;border-top:1px solid #eee}.condition-bad td{height:44px;padding-right:16px}
.query{padding:8px;border:1px solid #d9d9d9;border-radius:3px}.query-item{display:flex;align-items:flex-start;padding:4px 8px}.query-label{width:72px;text-align:right;line-height:32px}.query-value{height:32px;line-height:32px}.query-bad{border-width:2px;border-radius:8px}
.picker{display:flex;align-items:center;width:240px;height:32px;padding:0 8px;border:1px solid #d9d9d9;border-radius:3px;background:#fff}.picker-value{flex:1}.picker-icon{margin-left:auto;color:#808080}.picker-bad{height:40px}
.range{display:flex;align-items:center;gap:8px}.range input{width:145px;height:32px;padding:0 8px;border:1px solid #d9d9d9;border-radius:3px;color:#4d4d4d;font:inherit}
.drawer-stage{position:relative;height:150px;overflow:hidden;background:#f5f7fa}.mask{position:absolute;inset:0;background:rgba(0,0,0,.3)}.drawer{position:absolute;top:0;right:0;width:180px;height:100%;border-left:1px solid #d9d9d9;background:#fff;border-radius:0}.drawer header{height:40px;padding:0 16px;line-height:40px;font-weight:700}.drawer .body{padding:16px}.drawer .footer{position:absolute;left:16px;bottom:12px}.drawer-bad{left:0;right:auto;border-left:0;border-right:1px solid #d9d9d9}
</style></head><body><main><h1>复杂组件</h1>
<section class="row"><div id="condition-editor-bad" class="sample" data-component-family="condition-editor"><span class="label">错误条件编辑器</span><table class="condition-table condition-bad"><thead><tr><th>字段</th><th>关系</th><th>值</th></tr></thead><tbody><tr><td>状态</td><td>等于</td><td>启用</td></tr></tbody></table></div><div id="condition-editor-clean" class="sample" data-component-family="condition-editor"><span class="label">正确条件编辑器</span><table class="condition-table"><thead><tr><th>字段</th><th>关系</th><th>值</th></tr></thead><tbody><tr><td>状态</td><td>等于</td><td>启用</td></tr></tbody></table></div></section>
<section class="row"><div id="data-querying-bad" class="sample" data-component-family="data-querying"><span class="label">错误数据查询</span><div class="query query-bad"><div class="query-item"><span class="query-label">状态：</span><span class="query-value">全部</span></div></div></div><div id="data-querying-clean" class="sample" data-component-family="data-querying"><span class="label">正确数据查询</span><div class="query"><div class="query-item"><span class="query-label">状态：</span><span class="query-value">全部</span></div></div></div></section>
<section class="row"><div id="date-picker-bad" class="sample" data-component-family="date-picker" data-variant="date"><span class="label">错误日期选择器</span><div class="picker picker-bad"><span class="picker-value">2026-08-12 10:30</span><span class="picker-icon">▣</span></div></div><div id="date-picker-clean" class="sample" data-component-family="date-picker" data-variant="date"><span class="label">正确日期选择器</span><div class="picker"><span class="picker-value">2026-08-12</span><span class="picker-icon">▣</span></div></div></section>
<section class="row"><div id="date-range-picker-bad" class="sample" data-component-family="date-range-picker" data-layout="split"><span class="label">错误日期范围</span><div class="range"><input aria-label="开始日期" value="2026-08-20"><span>-</span><input aria-label="结束日期" value="2026-08-10"></div></div><div id="date-range-picker-clean" class="sample" data-component-family="date-range-picker" data-layout="split"><span class="label">正确日期范围</span><div class="range"><input aria-label="开始日期" value="2026-08-10"><span>到</span><input aria-label="结束日期" value="2026-08-20"></div></div></section>
<section class="row"><div id="drawer-bad" class="sample" data-component-family="drawer" data-placement="right" data-modal="true"><span class="label">错误右侧模态抽屉</span><div class="drawer-stage"><aside class="drawer drawer-bad"><header>详情</header><div class="body">抽屉内容</div><div class="footer">取消　确定</div></aside></div></div><div id="drawer-clean" class="sample" data-component-family="drawer" data-placement="right" data-modal="true"><span class="label">正确右侧模态抽屉</span><div class="drawer-stage"><div class="mask"></div><aside class="drawer"><header>详情</header><div class="body">抽屉内容</div><div class="footer">取消　确定</div></aside></div></div></section>
</main></body></html>
