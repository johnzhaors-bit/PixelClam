<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导航操作组件受控错误</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#4d4d4d;font:12px/1.5 "Helvetica Neue","PingFang SC",Tahoma,"Microsoft Yahei",sans-serif}main{margin:32px;padding:24px;background:#fff}h1{margin:0 0 24px}.row{display:flex;align-items:flex-start;gap:48px;margin:28px 0}.sample{min-width:360px}
.pagination{display:flex;align-items:center;height:28px;gap:8px}.page{display:inline-flex;align-items:center;justify-content:center;height:28px;min-width:28px;padding:0 3px;border:1px solid #d9d9d9}.page.active{color:#1993ff;background:#e6f5ff;border-color:#1993ff}.jump{height:28px;width:45px;margin:0 4px;padding:0 4px;border:1px solid #d9d9d9;border-radius:3px;color:#4d4d4d;background:#fff;text-align:center;font:12px/1.5 "Helvetica Neue","PingFang SC",Tahoma,"Microsoft Yahei",sans-serif}.pagination-bad .page{min-width:36px}.pagination-bad .jump{width:60px}
.breadcrumb{display:flex;align-items:center;height:32px;margin-bottom:8px;background:#fff}.crumb{font-size:12px}.separator{margin:0 8px;color:#bfbfbf;font-size:16px}.current{font-size:16px;font-weight:700}.breadcrumb-bad .current{font-size:12px;font-weight:400}
.toolbar{display:flex;gap:8px}.tool{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;padding:3px;border:1px solid transparent;border-radius:3px;color:#737373;font-size:16px;cursor:pointer}.toolbar-bad .tool{width:30px;height:30px;font-size:20px}
.popover{min-width:160px;border:1px solid #d9d9d9;border-radius:3px;background:#fff;box-shadow:0 4px 8px rgba(0,0,0,.15)}.popover-title{padding:8px 12px;border-bottom:1px solid #d9d9d9;font-size:14px}.popover-content{padding:8px 12px}.popover-bad{border-radius:9px}.popover-bad .popover-content{padding:16px 20px}
.collapse{width:280px;padding-top:2px;padding-bottom:2px}.collapse-title{position:relative;height:32px;line-height:32px;padding:0 28px 0 8px;font-weight:700}.collapse-icon{position:absolute;right:5px;top:8px;font-size:16px}.collapse-content{height:32px;line-height:32px;padding:0 28px 0 16px}.collapse-bad .collapse-title{height:40px;line-height:40px;padding-left:12px}
</style></head><body><main><h1>导航与操作组件</h1>
<section class="row"><div id="pagination-bad" class="sample pagination pagination-bad" data-component-family="pagination"><span class="page">‹</span><span class="page active">1</span><input class="jump" value="3" aria-label="跳转页码"></div><div id="pagination-clean" class="sample pagination" data-component-family="pagination"><span class="page">‹</span><span class="page active">1</span><input class="jump" value="3" aria-label="跳转页码"></div></section>
<section class="row"><nav id="breadcrumb-bad" class="sample breadcrumb breadcrumb-bad" data-component-family="breadcrumb" aria-label="错误面包屑"><a class="crumb" href="#resource-center">资源中心</a><span class="separator">/</span><span class="current" aria-current="page">资源详情</span></nav><nav id="breadcrumb-clean" class="sample breadcrumb" data-component-family="breadcrumb" aria-label="正确面包屑"><a class="crumb" href="#resource-center">资源中心</a><span class="separator">/</span><span class="current" aria-current="page">资源详情</span></nav></section>
<section class="row"><div id="toolbar-bad" class="sample toolbar toolbar-bad" data-component-family="toolbar" role="toolbar"><button class="tool" title="刷新" aria-label="刷新">↻</button><button class="tool" title="设置" aria-label="设置">⚙</button></div><div id="toolbar-clean" class="sample toolbar" data-component-family="toolbar" role="toolbar"><button class="tool" title="刷新" aria-label="刷新">↻</button><button class="tool" title="设置" aria-label="设置">⚙</button></div></section>
<section class="row"><div id="popover-bad" class="sample" data-component-family="popover"><div class="popover popover-bad" role="dialog" aria-label="错误说明浮层"><div class="popover-title">说明</div><div class="popover-content">这是相关说明内容</div></div></div><div id="popover-clean" class="sample" data-component-family="popover"><div class="popover" role="dialog" aria-label="正确说明浮层"><div class="popover-title">说明</div><div class="popover-content">这是相关说明内容</div></div></div></section>
