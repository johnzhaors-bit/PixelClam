<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>UXChecker 多组件可控错误</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #4d4d4d; background: #f5f7fa; font: 12px/1.5 "Helvetica Neue", "PingFang SC", Tahoma, "Microsoft Yahei", sans-serif; }
    main { margin: 32px; padding: 24px; background: #fff; }
    h1 { margin: 0; font-size: 20px; line-height: 32px; }
    .query-panel { margin-top: 16px; margin-left: 18px; }
    .form-row { display: flex; align-items: center; margin-bottom: 16px; }
    .form-row label { width: 96px; text-align: right; margin-right: 16px; }
    .custom-input {
      width: 240px;
      height: 38px;
      padding: 0 8px;
      color: #4d4d4d;
      background: #fff;
      border: 1px solid #d9d9d9;
      border-radius: 0;
      font: 12px/38px "Helvetica Neue", "PingFang SC", Tahoma, "Microsoft Yahei", sans-serif;
    }
    .custom-select {
      position: relative;
      width: 240px;
      height: 26px;
      padding: 0 30px 0 8px;
      color: #4d4d4d;
      background: #fff;
      border: 1px solid #d9d9d9;
      border-radius: 8px;
      line-height: 24px;
    }
    .custom-select::after { content: "⌄"; position: absolute; right: 8px; top: 2px; }
    .toolbar { display: flex; align-items: center; gap: 8px; margin-top: 24px; }
    .custom-primary-button {
      min-width: 88px;
      height: 40px;
      padding: 0 16px;
      color: #fff;
      background: #1993ff;
      border: 1px solid #1993ff;
      border-radius: 10px;
      letter-spacing: 1px;
      text-align: center;
      cursor: pointer;
      font: 12px/38px "Helvetica Neue", "PingFang SC", Tahoma, "Microsoft Yahei", sans-serif;
    }
  </style>
</head>
<body>
  <main id="resource-page">
    <h1 id="page-title">资源管理</h1>
    <section id="query-panel" class="query-panel" aria-label="查询条件">
      <div class="form-row">
        <label for="resource-name">资源名称</label>
        <input id="resource-name" class="custom-input" data-component-family="input" value="测试资源">
      </div>
      <div class="form-row">
        <label id="resource-type-label">资源类型</label>
        <div id="resource-type" class="custom-select" role="combobox" aria-labelledby="resource-type-label" data-component-family="select" data-variant="single">全部类型</div>
      </div>
      <div class="toolbar" aria-label="查询操作">
        <button id="query-button" class="custom-primary-button" data-component-family="button" data-variant="primary">查询</button>
      </div>
    </section>
  </main>
</body>
</html>
