<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>导航与提示组件受控错误</title><style>
*{box-sizing:border-box}body{margin:0;color:#4d4d4d;font:12px/1.5 Arial,sans-serif}main{padding:20px;position:relative}.row{display:flex;gap:24px;margin:18px 0}.sample{position:relative;width:390px;min-height:110px;padding:12px;border:1px solid #eee}.title{display:block;margin-bottom:8px;font-weight:700}
.menu{width:180px;margin:0;padding:0;list-style:none}.menu li{position:relative;padding:10px 12px;font-size:14px;line-height:20px}.menu .active{color:#1993ff;background:#e6f5ff}.menu .active:before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:#1993ff}.submenu{padding-left:28px!important}.menu-bad .submenu{padding-left:12px!important}
.message-box{width:400px;min-height:46px;padding:12px 40px 12px 16px;border:1px solid #f54c4c;border-left-width:4px;border-radius:5px;background:#fff;position:relative}.message-box .close{position:absolute;right:16px;top:12px}.message-title{font-size:14px;font-weight:700}.message-detail{margin-top:4px}
.system-prompt{display:flex;width:100%;padding:8px 16px;border:1px solid #94d2ff;border-radius:3px;background:#e6f5ff}.system-prompt .icon{margin-right:8px;color:#1993ff;font-size:20px}.system-bad{border-color:#94d2ff;background:#e6f5ff}.system-bad .icon{color:#1993ff}
.field{width:220px}.input{height:32px;border:1px solid #d9d9d9;border-radius:3px;padding:7px}.text-prompt{margin-top:4px;color:#999;font-size:12px}.text-prompt-bad{margin-top:30px;color:#333;font-size:18px;font-weight:700}
.toast-stage{height:100px;position:relative;background:#f5f7fa}.toast{position:absolute;top:8px;left:50%;transform:translateX(-50%);padding:10px 16px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);white-space:nowrap}.toast-bad{top:auto;bottom:8px;left:auto;right:8px;transform:none;width:320px;white-space:normal}.toast-action{display:block;margin-top:6px;color:#1993ff}
</style></head><body><main>
<section class="row"><div id="menu-bad" class="sample" data-component-family="menu"><span class="title">错误侧边导航</span><ul class="menu menu-bad"><li class="active">概览</li><li class="active">设置</li><li class="submenu">账号设置</li></ul></div><div id="menu-clean" class="sample" data-component-family="menu"><span class="title">正确侧边导航</span><ul class="menu"><li class="active">概览</li><li>设置</li><li class="submenu">账号设置</li></ul></div></section>
<section class="row"><div id="message-bad" class="sample" data-component-family="message" data-type="error"><span class="title">错误全局通知</span><div class="message-box"><span class="message-title">操作失败 ERR_DB_1042</span><div class="message-detail">系统发生错误</div><span class="close">×</span></div></div><div id="message-clean" class="sample" data-component-family="message" data-type="error"><span class="title">正确全局通知</span><div class="message-box"><span class="message-title">保存失败</span><div class="message-detail">网络连接中断，请检查网络后重试。</div><span class="close">×</span></div></div></section>
<section class="row"><div id="system-prompt-bad" class="sample" data-component-family="system-prompt" data-type="warning"><span class="title">错误系统提示</span><div class="system-prompt system-bad"><span class="icon">i</span><span>文件可能包含敏感信息。</span></div></div><div id="system-prompt-clean" class="sample" data-component-family="system-prompt" data-type="warning"><span class="title">正确系统提示</span><div class="system-prompt" style="background:#fffbdB;border-color:#f5c70f"><span class="icon" style="color:#f5c70f">!</span><span>请先移除敏感信息再上传。</span></div></div></section>
<section class="row"><div id="text-prompt-bad" class="sample" data-component-family="text-prompt"><span class="title">错误文字描述</span><div class="field"><div class="input">资源名称</div><div class="text-prompt text-prompt-bad">请输入资源名称</div></div></div><div id="text-prompt-clean" class="sample" data-component-family="text-prompt"><span class="title">正确文字描述</span><div class="field"><div class="input">资源名称</div><div class="text-prompt">用于列表中识别该资源</div></div></div></section>
<section class="row"><div id="toast-bad" class="sample" data-component-family="toast" data-type="success"><span class="title">错误吐司</span><div class="toast-stage"><div class="toast toast-bad">资源已经创建成功，接下来可以进入资源详情页面继续配置权限、标签、成员以及其他各项高级设置。<span class="toast-action">立即配置</span></div></div></div><div id="toast-clean" class="sample" data-component-family="toast" data-type="success"><span class="title">正确吐司</span><div class="toast-stage"><div class="toast">✓ 创建成功</div></div></div></section>
</main></body></html>
