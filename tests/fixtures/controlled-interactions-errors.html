<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>基础交互组件受控错误</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#4d4d4d;font:12px/1.5 "Helvetica Neue","PingFang SC",Tahoma,"Microsoft Yahei",sans-serif}main{margin:32px;padding:24px;background:#fff}h1{margin:0 0 24px}.row{display:flex;align-items:center;gap:32px;margin:16px 0}.sample{display:flex;align-items:center;gap:8px;min-width:180px}
.checkbox-box{width:20px;height:20px;border:1px solid #1993ff;border-radius:6px;background:#1993ff;position:relative}.checkbox-box:after{content:"";position:absolute;left:6px;top:2px;width:6px;height:10px;border:solid white;border-width:0 2px 2px 0;transform:rotate(45deg)}.checkbox-clean{width:14px;height:14px;border:1px solid #bfbfbf;border-radius:2px}
.radio-dot{width:20px;height:20px;border:4px solid #1993ff;border-radius:0}.radio-clean{width:14px;height:14px;border:4px solid #1993ff;border-radius:50%}
.switch-track{position:relative;width:50px;height:20px;border:1px solid #1993ff;border-radius:10px;background:#1993ff}.switch-track span{position:absolute;width:14px;height:14px;left:32px;top:2px;border-radius:50%;background:#fff}.switch-clean{position:relative;width:44px;height:22px;border:1px solid #d9d9d9;border-radius:11px}.switch-clean span{position:absolute;width:18px;height:18px;left:2px;top:1px;border-radius:50%;background:#fff}
.tabs{display:flex;border-bottom:1px solid #d9d9d9;font-size:14px}.tab-item{height:32px;padding:0 16px;color:#737373;line-height:30px}.tab-active{color:#1993ff;font-weight:400;border:1px solid #d9d9d9;border-top:2px solid #1993ff;border-bottom-color:transparent;background:#fff}.tab-close{margin-left:8px;font-size:24px}.tab-clean{font-weight:700}
.tag-bad{display:inline-block;padding:0 8px;line-height:30px;border:1px solid #d9d9d9;border-radius:10px}.tag-clean{display:inline-block;padding:0 8px;line-height:22px;border:1px solid #d9d9d9;border-radius:3px}
</style></head><body><main><h1>基础交互组件</h1>
<section class="row" aria-label="复选框示例"><div id="checkbox-bad" class="sample" data-component-family="checkbox"><span class="checkbox-box"></span><span>错误复选框</span></div><div id="checkbox-clean" class="sample" data-component-family="checkbox"><span class="checkbox-clean"></span><span>正确复选框</span></div></section>
<section class="row" aria-label="单选框示例"><div id="radio-bad" class="sample" data-component-family="radio"><span class="radio-dot"></span><span>错误单选框</span></div><div id="radio-clean" class="sample" data-component-family="radio"><span class="radio-clean"></span><span>正确单选框</span></div></section>
<section class="row" aria-label="开关示例"><div id="switch-bad" class="sample" data-component-family="switch"><span class="switch-track"><span></span></span><span>错误开关</span></div><div id="switch-clean" class="sample" data-component-family="switch"><span class="switch-clean"><span></span></span><span>正确开关</span></div></section>
<section class="row" aria-label="页签示例"><nav id="tab-bad" class="tabs" data-component-family="tab"><span class="tab-item tab-active">当前页<span class="tab-close">×</span></span><span class="tab-item">其他页</span></nav><nav id="tab-clean" class="tabs" data-component-family="tab"><span class="tab-item tab-active tab-clean">正确页</span><span class="tab-item">其他页</span></nav></section>
<section class="row" aria-label="标签示例"><div id="tag-bad" data-component-family="tag"><span class="tag-bad">错误标签</span></div><div id="tag-clean" data-component-family="tag"><span class="tag-clean">正确标签</span></div></section>
</main></body></html>
