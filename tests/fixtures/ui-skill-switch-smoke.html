<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Skill 切换验收小案例</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px; color: #1f2329; background: #f5f7fa; font: 14px Arial, sans-serif; }
    main { width: 720px; padding: 24px; background: white; }
    h1 { margin: 0 0 24px; font-size: 24px; }
    .form-row { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }
    label { width: 86px; }
    input, select { width: 240px; height: 40px; padding: 0 10px; border: 1px solid #999; border-radius: 10px; }
    .actions { display: flex; gap: 20px; margin-left: 104px; }
    button { height: 40px; min-width: 96px; padding: 0 18px; border: 0; border-radius: 10px; color: white; background: #0077ff; }
  </style>
</head>
<body>
  <main id="skill-switch-demo">
    <h1>资源查询</h1>
    <div class="form-row"><label for="name">资源名称</label><input id="name" value="测试资源" /></div>
    <div class="form-row"><label for="type">资源类型</label><select id="type"><option>全部类型</option></select></div>
    <div class="actions"><button id="query">查询</button><button id="reset">重置</button></div>
  </main>
</body>
</html>
