<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>数据与表单组件受控错误</title><style>
*{box-sizing:border-box}body{margin:0;color:#4d4d4d;font:12px/1.5 Arial,sans-serif}main{padding:20px}.row{display:flex;gap:24px;margin:18px 0}.sample{width:380px;min-height:100px;padding:12px;border:1px solid #eee}.title{display:block;margin-bottom:8px;font-weight:700}
.donut{display:flex;align-items:center;gap:16px}.ring{width:80px;height:80px;border-radius:50%;background:conic-gradient(#42aaff 0 60%,#6ecc89 60% 100%);display:grid;place-items:center}.ring:after{content:"";width:42px;height:42px;border-radius:50%;background:#fff}.center{position:absolute}.chart-wrap{position:relative;display:flex;align-items:center}.legend{list-style:none;padding:0;margin:0}.legend li{margin:4px}.dot{display:inline-block;width:8px;height:8px;margin-right:4px}.blue{background:#42aaff}.green{background:#6ecc89}.red{background:#f76d6a}
.handle-stage{position:relative;height:70px;background:#f5f7fa}.handle{position:absolute;right:1px;top:0;width:4px;height:100%;border-left:1px solid #d9d9d9;cursor:col-resize}.handle-bad{width:1px;cursor:default}
.form-row{display:flex;margin-bottom:16px}.form-label{width:100px;height:32px;padding-right:16px;text-align:right;line-height:32px}.control{height:32px;border:1px solid #d9d9d9;border-radius:3px;padding:0 8px;line-height:30px}.form-bad .form-label{height:40px;padding-right:4px;line-height:40px}
.formx-item{display:flex;margin-bottom:16px}.formx-label{width:100px;height:32px;padding-right:16px;text-align:right;line-height:32px}.formx-buttons{padding-top:16px}.formx-bad .formx-label{height:36px;line-height:36px}.formx-bad .formx-buttons{padding-top:4px}
.holiday{display:flex;align-items:center;gap:8px}.select{height:32px;min-width:120px;border:1px solid #d9d9d9;border-radius:3px;padding:0 8px;line-height:30px}.tags{display:flex;gap:4px}.tag{padding:2px 6px;background:#eef6ff}.holiday-bad{flex-direction:row-reverse;justify-content:flex-end}
</style></head><body><main>
<section class="row"><div id="donut-chart-bad" class="sample" data-component-family="donut-chart" data-total="100"><span class="title">错误环形图</span><div class="donut"><div class="chart-wrap"><div class="ring"></div><strong class="center">80</strong></div><ul class="legend"><li><i class="dot red"></i>已使用 60</li><li><i class="dot green"></i>剩余 40</li></ul></div></div><div id="donut-chart-clean" class="sample" data-component-family="donut-chart" data-total="100"><span class="title">正确环形图</span><div class="donut"><div class="chart-wrap"><div class="ring"></div><strong class="center">100</strong></div><ul class="legend"><li><i class="dot blue"></i>已使用 60</li><li><i class="dot green"></i>剩余 40</li></ul></div></div></section>
<section class="row"><div id="drag-handle-bad" class="sample" data-component-family="drag-handle" data-orientation="vertical"><span class="title">错误拖动把手</span><div class="handle-stage"><span class="handle handle-bad" aria-label="纵向拖动把手"></span></div></div><div id="drag-handle-clean" class="sample" data-component-family="drag-handle" data-orientation="vertical"><span class="title">正确拖动把手</span><div class="handle-stage"><span class="handle" aria-label="纵向拖动把手"></span></div></div></section>
<section class="row"><div id="form-bad" class="sample form-bad" data-component-family="form" data-layout="horizontal" data-size="default"><span class="title">错误表单</span><div class="form-row"><label class="form-label">名称</label><div class="control">示例</div></div></div><div id="form-clean" class="sample" data-component-family="form" data-layout="horizontal" data-size="default"><span class="title">正确表单</span><div class="form-row"><label class="form-label">名称</label><div class="control">示例</div></div></div></section>
<section class="row"><div id="form-x-bad" class="sample formx-bad" data-component-family="form-x" data-layout="horizontal" data-size="default"><span class="title">错误开放式表单</span><div class="formx-item"><label class="formx-label">名称</label><div class="control">示例</div></div><div class="formx-buttons">取消　保存</div></div><div id="form-x-clean" class="sample" data-component-family="form-x" data-layout="horizontal" data-size="default"><span class="title">正确开放式表单</span><div class="formx-item"><label class="formx-label">名称</label><div class="control">示例</div></div><div class="formx-buttons">取消　保存</div></div></section>
<section class="row"><div id="holiday-picker-bad" class="sample" data-component-family="holiday-picker" data-mode="multiple"><span class="title">错误节假日选择器</span><div class="holiday holiday-bad"><div class="select" aria-label="节假日">春节 2025-01-29</div><div class="select" aria-label="年份">2026</div></div><div class="tags"><span class="tag">春节</span><span class="tag">国庆节</span></div></div><div id="holiday-picker-clean" class="sample" data-component-family="holiday-picker" data-mode="multiple"><span class="title">正确节假日选择器</span><div class="holiday"><div class="select" aria-label="年份">2026</div><div class="select" aria-label="节假日">春节 2026-02-17</div></div><div class="tags"><span class="tag">春节 ×</span><span class="tag">国庆节 ×</span></div></div></section>
</main></body></html>
