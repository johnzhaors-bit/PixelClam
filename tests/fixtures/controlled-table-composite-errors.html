<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>表格与复合组件受控错误</title><style>
*{box-sizing:border-box}body{margin:0;color:#4d4d4d;font:12px/1.5 Arial,sans-serif}main{padding:20px}.row{display:flex;gap:24px;margin:18px 0}.sample{width:500px;min-height:120px;padding:12px;border:1px solid #eee}.title{display:block;margin-bottom:8px;font-weight:700}
.exec-top{padding-top:16px;line-height:24px}.exec-line{width:488px;padding-top:10px;border-bottom:1px dashed #d9d9d9}.exec-bad .exec-top{padding-top:4px}.exec-bad .exec-line{width:360px}
.view{margin-bottom:16px}.view-group{padding:8px 0;border:1px solid #d9d9d9;border-radius:3px}.view-item{display:block;padding:7px 16px;line-height:18px}.view-bad .view-group{border-radius:8px}.view-bad .view-item{line-height:26px}
.pick{display:flex;height:120px;overflow:hidden}.pick-side{display:inline-block;width:300px;min-width:300px;height:100%;padding:8px 0;border:1px solid #d9d9d9}.pick-middle{display:flex;min-width:16px;padding:0 8px;flex-direction:column;justify-content:center}.pick-middle button{margin-bottom:24px}.pick-bad .pick-side{width:220px;min-width:220px}.pick-bad .pick-middle button{margin-bottom:8px}
table{width:100%;border-collapse:collapse}th,td{border:1px solid #d9d9d9;text-align:left}.table-x th,.table-x td{height:40px;padding:0 8px}.table-x-bad th,.table-x-bad td{height:48px;padding:0 16px}.table-standard th,.table-standard td{height:40px;padding:0 8px}.table-standard-bad th,.table-standard-bad td{height:36px;padding:0 4px}th{background:#eee;font-weight:700}
</style></head><body><main>
<section class="row"><div id="executive-strategy-bad" class="sample exec-bad" data-component-family="executive-strategy"><span class="title">错误执行策略</span><div class="exec-top">周期执行：每天 09:00</div><div class="exec-line">有效时间：2026-08-12 至 2026-09-12</div></div><div id="executive-strategy-clean" class="sample" data-component-family="executive-strategy"><span class="title">正确执行策略</span><div class="exec-top">周期执行：每天 09:00</div><div class="exec-line">有效时间：2026-08-12 至 2026-09-12</div></div></section>
<section class="row"><div id="information-view-bad" class="sample view view-bad" data-component-family="information-view"><span class="title">错误信息查看</span><div class="view-group"><div class="view-item"><span>资源名称：</span><span>生产数据库</span></div><div class="view-item"><span>负责人：</span><span>张三</span></div></div></div><div id="information-view-clean" class="sample view" data-component-family="information-view"><span class="title">正确信息查看</span><div class="view-group"><div class="view-item"><span>资源名称：</span><span>生产数据库</span></div><div class="view-item"><span>负责人：</span><span>张三</span></div></div></div></section>
<section class="row"><div id="pick-list-bad" class="sample" data-component-family="pick-list"><span class="title">错误列表选择</span><div class="pick pick-bad"><div class="pick-side">可选项<br>资源 A<br>资源 B</div><div class="pick-middle"><button>→</button><button>←</button></div><div class="pick-side">已选项<br>资源 C</div></div></div><div id="pick-list-clean" class="sample" data-component-family="pick-list"><span class="title">正确列表选择</span><div class="pick"><div class="pick-side">可选项<br>资源 A<br>资源 B</div><div class="pick-middle"><button>→</button><button>←</button></div><div class="pick-side">已选项<br>资源 C</div></div></div></section>
<section class="row"><div id="table-x-bad" class="sample" data-component-family="table-x" data-size="normal"><span class="title">错误开放式表格</span><table class="table-x table-x-bad"><thead><tr><th>名称</th><th>状态</th></tr></thead><tbody><tr><td>资源 A</td><td>运行中</td></tr></tbody></table></div><div id="table-x-clean" class="sample" data-component-family="table-x" data-size="normal"><span class="title">正确开放式表格</span><table class="table-x"><thead><tr><th>名称</th><th>状态</th></tr></thead><tbody><tr><td>资源 A</td><td>运行中</td></tr></tbody></table></div></section>
<section class="row"><div id="table-bad" class="sample" data-component-family="table" data-size="normal"><span class="title">错误标准表格</span><table class="table-standard table-standard-bad plx-table"><thead><tr><th>名称</th><th>状态</th></tr></thead><tbody><tr><td>资源 A</td><td>运行中</td></tr></tbody></table></div><div id="table-clean" class="sample" data-component-family="table" data-size="normal"><span class="title">正确标准表格</span><table class="table-standard plx-table"><thead><tr><th>名称</th><th>状态</th></tr></thead><tbody><tr><td>资源 A</td><td>运行中</td></tr></tbody></table></div></section>
</main></body></html>
