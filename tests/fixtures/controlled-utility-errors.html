<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>辅助组件受控错误</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#4d4d4d;font:12px/1.5 "Helvetica Neue","PingFang SC",Tahoma,"Microsoft Yahei",sans-serif}main{margin:32px;padding:24px;background:#fff}h1{margin:0 0 24px}.row{display:flex;align-items:flex-start;gap:48px;margin:28px 0}.sample{position:relative;width:420px;min-height:80px;border:1px solid #eee;padding:16px}
.link{color:#1993ff;text-decoration:none;cursor:pointer}.link-bad{color:#1993ff;text-decoration:underline;cursor:default}
.anchor-layout{display:grid;grid-template-columns:1fr 120px;gap:16px}.sections{display:grid;gap:8px}.section{height:24px}.anchor-list{display:grid;align-content:start;border-left:1px solid #e5e5e5}.anchor-list a{height:24px;padding-left:16px;margin-left:-1px;border-left:1px solid transparent;color:#4d4d4d;text-decoration:none;line-height:24px;cursor:pointer}.anchor-list a.active{color:#1993ff;border-left-color:#1993ff}
.back-area{height:140px}.back-button{position:absolute;right:16px;bottom:16px;width:48px;height:48px;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;background:#1993ff;box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:24px;cursor:pointer}.back-bad{left:16px;right:auto;top:16px;bottom:auto}
.empty{height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px}.empty-bad{align-items:flex-start;justify-content:flex-start;text-align:left}.empty-action{color:#1993ff}.empty-bad .empty-action{order:-1}
.loading{display:inline-block;border-style:solid;border-radius:50%;border-color:#1993ff #eee #eee}.loading-clean{width:24px;height:24px;border-width:2px}.loading-bad{width:32px;height:32px;border-width:5px}
</style></head><body><main><h1>辅助组件</h1>
<section class="row"><div id="link-bad" class="sample" data-component-family="link"><a class="link-bad" href="#target">错误链接</a></div><div id="link-clean" class="sample" data-component-family="link"><a class="link" href="#target">正确链接</a></div></section>
<section class="row"><div id="anchor-bad" class="sample anchor-layout" data-component-family="anchor"><div class="sections"><section id="bad-overview" class="section">概览</section><section id="bad-config" class="section">配置</section><section id="bad-history" class="section">历史</section></div><nav class="anchor-list" aria-label="错误页内导航"><a href="#bad-config">配置</a><a class="active" href="#bad-overview">概览</a></nav></div><div id="anchor-clean" class="sample anchor-layout" data-component-family="anchor"><div class="sections"><section id="clean-overview" class="section">概览</section><section id="clean-config" class="section">配置</section><section id="clean-history" class="section">历史</section></div><nav class="anchor-list" aria-label="正确页内导航"><a class="active" href="#clean-overview">概览</a><a href="#clean-config">配置</a><a href="#clean-history">历史</a></nav></div></section>
<section class="row"><div id="back-top-bad" class="sample back-area" data-component-family="back-top" data-scroll-top="480" data-scroll-height="1200"><button class="back-button back-bad" aria-label="回到顶部">↓</button></div><div id="back-top-clean" class="sample back-area" data-component-family="back-top" data-scroll-top="480" data-scroll-height="1200"><button class="back-button" aria-label="回到顶部">↑</button></div></section>
<section class="row"><div id="empty-bad" class="sample empty empty-bad" data-component-family="empty" data-variant="container"><span class="empty-action">创建资源</span><span aria-hidden="true">□</span><strong>暂无资源</strong><span>请先创建资源</span></div><div id="empty-clean" class="sample empty" data-component-family="empty" data-variant="container"><span aria-hidden="true">□</span><strong>暂无资源</strong><span>请先创建资源</span><span class="empty-action">创建资源</span></div></section>
<section class="row"><div id="loading-bad" class="sample" data-component-family="loading" data-variant="min"><span class="loading loading-bad" aria-label="加载中"></span></div><div id="loading-clean" class="sample" data-component-family="loading" data-variant="min"><span class="loading loading-clean" aria-label="加载中"></span></div></section>
</main></body></html>
