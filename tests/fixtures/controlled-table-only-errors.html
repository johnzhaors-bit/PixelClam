<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>标准表格定向复测</title><style>
*{box-sizing:border-box}body{margin:0;color:#4d4d4d;font:12px/1.5 Arial,sans-serif}main{display:flex;gap:24px;padding:20px}.sample{width:500px;padding:12px;border:1px solid #eee}.title{display:block;margin-bottom:8px;font-weight:700}table{width:100%;border-collapse:collapse}th,td{height:40px;padding:0 8px;border:1px solid #d9d9d9;text-align:left}th{background:#eee;font-weight:700}.bad th,.bad td{height:36px;padding-left:4px;padding-right:4px}
</style></head><body><main><div id="table-bad" class="sample" data-component-family="table" data-size="normal"><span class="title">错误标准表格</span><table class="plx-table bad"><thead><tr><th>名称</th><th>状态</th></tr></thead><tbody><tr><td>资源 A</td><td>运行中</td></tr></tbody></table></div><div id="table-clean" class="sample" data-component-family="table" data-size="normal"><span class="title">正确标准表格</span><table class="plx-table"><thead><tr><th>名称</th><th>状态</th></tr></thead><tbody><tr><td>资源 A</td><td>运行中</td></tr></tbody></table></div></main></body></html>
