<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>图表与内容组件受控错误</title><style>
*{box-sizing:border-box}body{margin:0;color:#4d4d4d;font:12px/1.5 Arial,sans-serif}main{padding:20px}.row{display:flex;gap:24px;margin:18px 0}.sample{width:390px;min-height:110px;padding:12px;border:1px solid #eee}.title{display:block;margin-bottom:8px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:20px;height:90px;border-left:1px solid #999;border-bottom:1px solid #999;padding:0 16px}.bar{width:30px;background:#42aaff}.bar-label{text-align:center}.bar-wrap{display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.line-chart{position:relative;width:260px;height:90px;border-left:1px solid #999;border-bottom:1px solid #999}.point{position:absolute;width:8px;height:8px;border-radius:50%;background:#42aaff}.segment{position:absolute;height:2px;background:#42aaff;transform-origin:left center}
.rate{display:flex;align-items:center}.star{font-size:22px;color:#e5e5e5}.star+.star{margin-left:8px}.star.on{color:#f08316}.rate-bad .star:nth-child(2){color:#e5e5e5}.rate-bad .star:nth-child(3){color:#f08316}
.ellipsis{display:block;width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ellipsis-bad{width:300px}.full{margin-top:4px;color:#808080}
.timeline{list-style:none;margin:0;padding:0}.timeline li{position:relative;min-height:42px;padding:0 0 16px 29px}.node{position:absolute;left:0;top:2px;width:11px;height:11px;border:2px solid #1993ff;border-radius:50%}.connector{position:absolute;left:5px;top:13px;height:29px;border-left:1px solid #d9d9d9}.timeline li:last-child .connector{display:none}.timeline-bad li:nth-child(2) .connector{display:none}
</style></head><body><main>
<section class="row"><div id="bar-chart-bad" class="sample" data-component-family="bar-chart" data-values="A:60,B:40"><span class="title">错误柱状图</span><div class="bars"><div class="bar-wrap"><div class="bar" style="height:40px"></div><span class="bar-label">A 60</span></div><div class="bar-wrap"><div class="bar" style="height:60px"></div><span class="bar-label">B 40</span></div></div></div><div id="bar-chart-clean" class="sample" data-component-family="bar-chart" data-values="A:60,B:40"><span class="title">正确柱状图</span><div class="bars"><div class="bar-wrap"><div class="bar" style="height:60px"></div><span class="bar-label">A 60</span></div><div class="bar-wrap"><div class="bar" style="height:40px"></div><span class="bar-label">B 40</span></div></div></div></section>
<section class="row"><div id="line-chart-bad" class="sample" data-component-family="line-chart" data-points="Jan:20,Feb:60,Mar:40"><span class="title">错误折线图</span><div class="line-chart"><i class="point" style="left:20px;bottom:20px"></i><i class="point" style="left:120px;bottom:40px"></i><i class="point" style="left:220px;bottom:60px"></i><span style="position:absolute;bottom:-18px;left:10px">Jan　　Mar　　Feb</span></div></div><div id="line-chart-clean" class="sample" data-component-family="line-chart" data-points="Jan:20,Feb:60,Mar:40"><span class="title">正确折线图</span><div class="line-chart"><i class="point" style="left:20px;bottom:20px"></i><i class="point" style="left:120px;bottom:60px"></i><i class="point" style="left:220px;bottom:40px"></i><span style="position:absolute;bottom:-18px;left:10px">Jan　　Feb　　Mar</span></div></div></section>
<section class="row"><div id="rate-bad" class="sample" data-component-family="rate" data-value="2"><span class="title">错误评分</span><div class="rate rate-bad" aria-label="2分"><i class="star on">★</i><i class="star">★</i><i class="star">★</i><i class="star">★</i></div></div><div id="rate-clean" class="sample" data-component-family="rate" data-value="2"><span class="title">正确评分</span><div class="rate" aria-label="2分"><i class="star on">★</i><i class="star on">★</i><i class="star">★</i><i class="star">★</i><i class="star">★</i></div></div></section>
<section class="row"><div id="text-ellipsis-bad" class="sample" data-component-family="text-ellipsis"><span class="title">错误文字省略</span><span class="ellipsis ellipsis-bad" data-full-text="资源名称">资源名称…</span><div class="full">完整文字仅4字且容器足够</div></div><div id="text-ellipsis-clean" class="sample" data-component-family="text-ellipsis"><span class="title">正确文字省略</span><span class="ellipsis" data-full-text="这是一个需要省略显示的非常长的资源名称">这是一个需要省略显示的非常长的资源名称</span></div></section>
<section class="row"><div id="time-line-bad" class="sample" data-component-family="time-line"><span class="title">错误时间轴</span><ol class="timeline timeline-bad"><li><i class="node"></i><i class="connector"></i><strong>开始</strong> 10:00</li><li><i class="node"></i><i class="connector"></i><strong>处理中</strong> 09:30</li><li><i class="node"></i><strong>完成</strong> 11:00</li></ol></div><div id="time-line-clean" class="sample" data-component-family="time-line"><span class="title">正确时间轴</span><ol class="timeline"><li><i class="node"></i><i class="connector"></i><strong>开始</strong> 09:00</li><li><i class="node"></i><i class="connector"></i><strong>处理中</strong> 10:00</li><li><i class="node"></i><strong>完成</strong> 11:00</li></ol></div></section>
</main></body></html>
