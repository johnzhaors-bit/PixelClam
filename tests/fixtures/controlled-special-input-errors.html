<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>专项输入与引导受控错误</title><style>
*{box-sizing:border-box}body{margin:0;color:#4d4d4d;font:12px/1.5 Arial,sans-serif}main{padding:20px}.row{display:flex;gap:24px;margin:18px 0}.sample{position:relative;width:400px;min-height:115px;padding:12px;border:1px solid #eee}.title{display:block;margin-bottom:8px;font-weight:700}
.location-row{display:flex;gap:6px}.location-input{width:32%;height:32px;padding:0 8px;border:1px solid #d9d9d9;border-radius:3px}.address{display:block;width:100%;height:32px;margin-top:16px;padding:0 8px;border:1px solid #d9d9d9;border-radius:3px}.location-bad{flex-direction:row-reverse}.location-bad+.address{margin-top:4px}
.period-title{height:32px;line-height:32px}.period{display:flex}.period-hour{width:39px;height:16px;border:1px solid #d9d9d9;border-right:0}.period-hour:first-child{border-radius:2px 0 0 2px}.period-hour:last-child{border-right:1px solid #d9d9d9;border-radius:0 2px 2px 0}.period-bad .period-hour{width:50px;height:24px}
.search{position:relative;width:240px;height:32px;border:1px solid #d9d9d9;border-radius:3px;padding:0 32px 0 8px;line-height:30px}.search-icon{position:absolute;right:8px}.search-bad{height:40px;line-height:38px;padding-left:32px;padding-right:8px}.search-bad .search-icon{left:8px;right:auto}
.tip-label{display:flex;align-items:center;gap:4px}.help{display:inline-grid;place-items:center;width:16px;height:16px;border:1px solid #1993ff;border-radius:50%;color:#1993ff}.tip-card{margin-top:6px;padding:6px 8px;border:1px solid #d9d9d9;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}.tip-bad .help{margin-left:120px}.tip-bad .tip-card{width:300px;margin-left:-20px}
.guide-stage{position:relative;height:150px;background:#f5f7fa}.target{position:absolute;left:24px;top:50px;padding:8px;border:2px solid #1993ff;background:#fff}.mask{position:absolute;inset:0;background:rgba(0,0,0,.35)}.guide{position:absolute;left:130px;top:20px;width:220px;padding:16px;background:#fff}.guide-close{position:absolute;right:8px;top:6px}.arrow{position:absolute;left:-10px;top:40px}.footer{display:flex;justify-content:space-between;margin-top:16px}.guide-bad .arrow{left:auto;right:-10px}.guide-bad .footer span:first-child{order:2}
</style></head><body><main>
<section class="row"><div id="location-bad" class="sample" data-component-family="location" data-size="default"><span class="title">错误地理位置</span><div class="location-row location-bad"><input class="location-input" value="滨江区" aria-label="区县"><input class="location-input" value="杭州市" aria-label="城市"><input class="location-input" value="浙江省" aria-label="省份"></div><input class="address" value="长河街道" aria-label="详细地址"></div><div id="location-clean" class="sample" data-component-family="location" data-size="default"><span class="title">正确地理位置</span><div class="location-row"><input class="location-input" value="浙江省" aria-label="省份"><input class="location-input" value="杭州市" aria-label="城市"><input class="location-input" value="滨江区" aria-label="区县"></div><input class="address" value="长河街道" aria-label="详细地址"></div></section>
<section class="row"><div id="period-picker-bad" class="sample" data-component-family="period-picker" data-granularity="hour"><span class="title period-title">错误时间段</span><div class="period period-bad"><i class="period-hour"></i><i class="period-hour"></i><i class="period-hour"></i></div></div><div id="period-picker-clean" class="sample" data-component-family="period-picker" data-granularity="hour"><span class="title period-title">正确时间段</span><div class="period"><i class="period-hour"></i><i class="period-hour"></i><i class="period-hour"></i></div></div></section>
<section class="row"><div id="search-bad" class="sample" data-component-family="search" data-size="default"><span class="title">错误搜索框</span><div class="search search-bad">搜索资源<span class="search-icon">⌕</span></div></div><div id="search-clean" class="sample" data-component-family="search" data-size="default"><span class="title">正确搜索框</span><div class="search">搜索资源<span class="search-icon">⌕</span></div></div></section>
<section class="row"><div id="tip-bad" class="sample tip-bad" data-component-family="tip"><span class="title">错误信息提示</span><div class="tip-label">资源名称<span class="help">?</span></div><div class="tip-card">这里是一段与资源名称无关的账号权限、网络策略和部署环境综合说明，而且遮挡下方输入区域。</div></div><div id="tip-clean" class="sample" data-component-family="tip"><span class="title">正确信息提示</span><div class="tip-label">资源名称<span class="help">?</span></div><div class="tip-card">用于在资源列表中识别该资源</div></div></section>
<section class="row"><div id="novice-guide-bad" class="sample" data-component-family="novice-guide" data-step="2" data-total="3"><span class="title">错误新手指引</span><div class="guide-stage"><div class="mask"></div><div class="target">新建资源</div><div class="guide guide-bad"><button class="guide-close" aria-label="关闭">×</button><span class="arrow">▶</span><strong>创建资源</strong><p>点击这里创建资源。</p><div class="footer"><span>上一步</span><span>1/3　完成</span></div></div></div></div><div id="novice-guide-clean" class="sample" data-component-family="novice-guide" data-step="2" data-total="3"><span class="title">正确新手指引</span><div class="guide-stage"><div class="mask"></div><div class="target">新建资源</div><div class="guide"><button class="guide-close" aria-label="关闭">×</button><span class="arrow">◀</span><strong>创建资源</strong><p>点击这里创建资源。</p><div class="footer"><span>上一步</span><span>2/3　下一步</span></div></div></div></div></section>
</main></body></html>
